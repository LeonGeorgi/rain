name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed, edited]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Data commit that requested publication (newer main takes precedence)
        type: string
        required: false

permissions: {}

# A complete snapshot is deployed each time. Serialize the entire workflow so
# production updates, preview updates and removals cannot overwrite each other.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
      pull-requests: read
    outputs:
      main_sha: ${{ steps.plan.outputs.main_sha }}
      base: ${{ steps.plan.outputs.base }}
      previews: ${{ steps.plan.outputs.previews }}
      matrix: ${{ steps.plan.outputs.matrix }}
      has_previews: ${{ steps.plan.outputs.has_previews }}
    steps:
      # Helpers always come from the trusted workflow revision, never a PR.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: plan
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        with:
          script: |
            const {previewPlan} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pages-preview.mjs`);
            const branch = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const pulls = await github.paginate(github.rest.pulls.list, {...context.repo, state: 'open', base: 'main', per_page: 100});
            const previews = previewPlan(pulls, `${context.repo.owner}/${context.repo.repo}`, process.env.PAGES_BASE);
            if (previews.length > 256) throw new Error('Too many previews for one Actions matrix');
            core.setOutput('main_sha', branch.data.commit.sha);
            core.setOutput('base', `${process.env.PAGES_BASE.replace(/\/$/, '')}/`);
            core.setOutput('previews', previews);
            core.setOutput('has_previews', previews.length > 0);
            core.setOutput('matrix', {include: previews.length ? previews : [{number: 0, sha: branch.data.commit.sha, base: '/'}]});

  production:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.main_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm data:validate
      - name: Build production
        env:
          BUILD_BASE: ${{ needs.plan.outputs.base }}
        run: pnpm build --base="$BUILD_BASE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: rain-production
          path: dist
          if-no-files-found: error
          retention-days: 1

  previews:
    needs: plan
    if: needs.plan.outputs.has_previews == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR code only executes on fresh read-only runners: no environment, secrets,
    # write permissions, persisted checkout credentials or shared build cache.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm data:validate
      - name: Build preview with its own asset and data paths
        env:
          BUILD_BASE: ${{ matrix.base }}
        run: pnpm build --base="$BUILD_BASE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rain-preview-${{ matrix.number }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: [plan, production, previews]
    if: ${{ !cancelled() && needs.production.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      published: ${{ steps.assemble.outputs.published }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      # Download the exact artifact ID emitted by the trusted production job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.production.outputs.artifact_id }}
          path: artifacts/production
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rain-preview-*
          path: artifacts/previews
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: assemble
        env:
          PREVIEWS: ${{ needs.plan.outputs.previews }}
        with:
          script: |
            const {assembleSite} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pages-preview.mjs`);
            const published = await assembleSite('artifacts/production', 'artifacts/previews', 'site', JSON.parse(process.env.PREVIEWS));
            core.setOutput('published', published);
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

  comment:
    needs: [plan, assemble, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEWS: ${{ needs.plan.outputs.previews }}
          PUBLISHED: ${{ needs.assemble.outputs.published }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const {previewComment, updatePreviewComment} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pages-preview.mjs`);
            const published = JSON.parse(process.env.PUBLISHED);
            for (const preview of JSON.parse(process.env.PREVIEWS)) {
              const {data: current} = await github.rest.pulls.get({...context.repo, pull_number: preview.number});
              // Do not advertise an older snapshot as the latest commit.
              if (current.state !== 'open' || current.head.sha !== preview.sha) continue;
              const body = previewComment(preview, process.env.PAGE_URL, published.some(item => item.number === preview.number));
              await updatePreviewComment(github, context.repo, preview.number, body);
            }
            const closed = context.payload.pull_request;
            if (context.payload.action === 'closed' && closed?.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`) {
              await updatePreviewComment(github, context.repo, closed.number, '<!-- rain-pr-preview -->\nPreview removed because this PR is closed.');
            }
