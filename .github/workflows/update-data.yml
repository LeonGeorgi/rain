name: Update weather data

on:
  schedule:
    - cron: '23 0,12 * * *'
  workflow_dispatch:
    inputs:
      refresh_history:
        description: Re-fetch historical data for all stations
        type: boolean
        default: false

permissions: {}

concurrency:
  group: weather-data-update
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Fetch and validate JMA, DWD, NOAA and KNMI measurements
        env:
          REFRESH_HISTORY: ${{ inputs.refresh_history || false }}
          DATA_UPDATE_DIAGNOSTICS_DIR: ${{ runner.temp }}/rain-data-update-diagnostics
        run: |
          if [ "$REFRESH_HISTORY" = true ]; then
            pnpm data:update --refresh-history
          else
            pnpm data:update
          fi
      - name: Preserve rejected data for regression diagnosis
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rain-data-update-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rain-data-update-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm data:validate
      - name: Summarize station coverage
        run: pnpm data:coverage >> "$GITHUB_STEP_SUMMARY"
      - name: Save the validated data in Git
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update published weather measurements'
            git push origin HEAD
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN commits do not trigger another push workflow. Invoke the
  # deployment explicitly with the exact data commit from the successful job.
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
      pull-requests: write
    needs: update
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.update.outputs.commit }}

